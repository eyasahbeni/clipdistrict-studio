[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "clipdistrict-studio"
version = "0.1.0"
description = "GTA 6 Shorts: local-first clipper and official YouTube metadata search/private upload"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
youtube-upload = [
  "google-api-python-client>=2.140,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
clipdistrict = "clipdistrict.cli:main"

[tool.setuptools.packages.find]
include = ["clipdistrict*"]
