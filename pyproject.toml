[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "clipdistrict-studio"
version = "1.0.0"
description = "Local-first GTA 6 Shorts clipping starter with official YouTube discovery and private upload"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
transcription = ["faster-whisper>=1.0,<3"]

youtube-upload = [
  "google-api-python-client>=2.140,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
clipdistrict = "clipdistrict.cli:main"

[tool.setuptools.packages.find]
include = ["clipdistrict*"]

[tool.setuptools.package-data]
clipdistrict = ["static/*.html", "static/*.css", "static/*.js"]
